</style></head><body><div id="app"></div><div id="toast" role="status"></div><script>const pages=['Command Centre','Ward / Vasti map','Sanstha','Attendance','Assigned task','Evidence','Verification','Citizen grievance','Inspection','Grant recommendation','Analytics','Administration'];
const roles=['Command Centre','BMC Admin','Sanstha Coordinator','Worker','Supervisor / Inspector','Citizen','Ward / Zone Officer','Finance / Approver'];
const rolePage=[0,11,2,3,6,7,1,9];
const initial=()=>({page:-1,role:'Command Centre',ward:'M/E',vasti:'Vasti 07',attended:false,offline:false,before:false,after:false,synced:false,submitted:false,verified:false,rework:false,grievance:false,grievanceText:'Waste remains near the shared collection point.',inspected:false,notice:false,closed:false,recommended:false,approved:false,reconciled:false,configPending:false,configApproved:false,audit:[]});
let state=initial();const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(s){state.audit.unshift({time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),text:s});}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',3500)}
function go(n){if(n<0||n>=pages.length)return;state.page=n;render();window.scrollTo(0,0)}
function badge(s,type=''){return `<span class="badge ${type}">${s}</span>`}function metric(n,t,d){return `<div class="card metric"><span>${t}</span><strong>${n}</strong><em>${d}</em></div>`}
function btn(s,action,primary=false,disabled=false){return `<button class="${primary?'primary':''}" onclick="${esc(action)}" ${disabled?'disabled':''}>${s}</button>`}
function heading(title,sub,right=''){return `<div class="heading"><div><div class="eyebrow">BSSY Operations / ${state.ward}</div><h1>${title}</h1><p>${sub}</p></div>${right}</div>`}
function table(head,rows){return `<div class="table-wrap"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function map(detail=false){return `<div class="map">${(detail?['Vasti 07','Vasti 08','Vasti 09','Vasti 10']:['M/E','L','N','S']).map((w,i)=>`<button class="${(detail?state.vasti:state.ward)===w?'selected':i===1?'warn':''}" onclick="selectMap('${w}',${detail})">${w}<br><small style="color:inherit">${detail?['Unit 03','Unit 04','Unit 05','Unit 06'][i]:[32,28,34,26][i]+' tasks'}</small></button>`).join('')}<div class="map-label">Schematic geography • synthetic locations • not BMC GIS layers</div></div>`}
function selectMap(w,detail){if(detail)state.vasti=w;else{state.ward=w;state.vasti='Vasti 07'}render()}
function evidence(which){return `<div class="evidence"><div class="building"></div><div class="road"></div>${which==='Before'?'<div class="waste">▰ ▱ ▰</div>':''}<span class="label">${which}</span><span class="caption">Illustrative scene • not field evidence</span></div>`}
function login(){return `<div class="login"><section class="login-hero"><div class="brand">BSSY</div><div class="eyebrow" style="color:#88cbb9;margin-top:10px">Nanostuffs Technologies</div><h1>Every service.<br>Evidence to<br>approval.</h1><p>A conceptual walkthrough of field operations, verification and assistance-grant recommendation for BMC.</p><div class="login-steps">ASSIGN / CAPTURE / VERIFY / RECOMMEND</div></section><section class="login-form"><span class="concept">CONCEPTUAL PROTOTYPE · SYNTHETIC DATA</span><h2>Choose your demo role</h2><p class="muted">Explore a sample service day, 15 September 2026. No credentials or personal data are required.</p><label class="field">Demo role<select id="login-role">${roles.map(r=>`<option>${r}</option>`).join('')}</select></label><button class="primary" onclick="enter()">Open demo workspace</button><p class="subtle">Role selection simulates different views. It is not production authentication or access control. The demo resets on refresh.</p><div class="strip">Technology-neutral, open architecture. Final workflows, GIS layers and policy parameters require BMC confirmation.</div></section></div>`}
function enter(){state.role=$('login-role').value;state.page=rolePage[roles.indexOf(state.role)];render()}
function shell(body){return `<div class="shell"><aside class="sidebar"><div class="brand">BSSY</div><small>Nanostuffs concept platform</small><nav class="nav">${pages.map((p,i)=>`<button class="${state.page===i?'active':''}" onclick="go(${i})"><b>${String(i+1).padStart(2,'0')}</b>${p}</button>`).join('')}</nav><footer>EOI aligned concept<br>15 September 2026 demo data<br><button style="margin-top:12px;background:transparent;color:#bed5d1;border-color:#49676a;font-size:12px" onclick="resetDemo()">Reset walkthrough</button></footer></aside><main class="main"><header class="topbar"><span class="concept">CONCEPTUAL · ALL DATA IS SYNTHETIC</span><div class="row"><small>View as</small><select aria-label="Demo role" onchange="changeRole(this.value)">${roles.map(r=>`<option ${state.role===r?'selected':''}>${r}</option>`).join('')}</select></div></header><div class="content">${body}<div class="guide"><div><b>Guided walkthrough · ${state.page+1} of ${pages.length}</b><small>${state.page===11?'Configuration changes retain a maker-checker trail.':'Next: '+pages[state.page+1]}</small></div><div class="row">${state.page>0?btn('Back',`go(${state.page-1})`):''}${state.page<11?btn('Continue',`go(${state.page+1})`,true):btn('Command Centre','go(0)',true)}</div></div><div class="subtle">Proposed screens and capabilities. Sample amounts, locations, thresholds and people are illustrative. No live GPS, camera, biometric, payment or BMC integration is connected.</div></div></main></div>`}
function changeRole(r){state.role=r;state.page=rolePage[roles.indexOf(r)];render()}
function resetDemo(){state=initial();render();toast('Demo reset. All changes were session-only.')}
function dashboard(){return heading('City operations at a glance','Sample cohort across four wards. Click a ward to focus the view.',badge('15 Sep 2026','gray'))+`<div class="grid four">${metric('120','Assigned tasks','Sample cohort')}${metric(state.verified?'97':'96','Verified tasks',state.verified?'80.8% verified':'80% verified')}${metric('112 / 120','Workers present','Sample cohort attendance')}${metric(state.grievance&&!state.closed?'9':'8','Open grievances','Officer attention required')}</div><div class="grid two" style="margin-top:20px"><section class="card"><div class="row"><h2>Ward overview</h2>${badge('4 sample wards','gray')}</div>${map()}<div class="actions">${btn('Open '+state.ward+' ward','go(1)',true)}</div></section><section class="card"><h2>Attention queue</h2><div class="stack"><div><div class="row"><b>Evidence review</b>${badge(state.verified?'11':'12','amber')}</div><p class="muted">Pending supervisor verification</p>${btn('Review service T-1042','go(6)')}</div><div class="hr"></div><div><div class="row"><b>Field exceptions</b>${badge('12','red')}</div><p class="muted">Incomplete, rework or rejected tasks</p>${btn('Inspect an exception','go(8)')}</div><div class="hr"></div><div><b>Grant recommendation</b><p class="muted">September sample period: ${state.approved?'approved in demo':state.recommended?'awaiting checker':'validation pending'}</p>${btn('Review validation gates','go(9)')}</div></div></section></div>`}
function ward(){const selected=state.vasti==='Vasti 07';return heading('Ward '+state.ward+' / '+state.vasti,'Drill from geography to the accountable Sanstha and service instance.')+`<div class="grid two"><section class="card"><h2>Vasti and Unit view</h2>${map(true)}<p class="subtle">Selection illustrates spatial drill-down. Production boundaries come from BMC-approved layers.</p></section><section class="card"><h2>${state.vasti} / ${selected?'Unit 03':'Unit '+({'Vasti 08':'04','Vasti 09':'05','Vasti 10':'06'}[state.vasti])}</h2>${badge(selected?'1 service in guided demo':'Read-only sample location','gray')}<p><b>${selected?'Sahyog Swachhata Sanstha':'Pragati Seva Sanstha'}</b><br><span class="muted">Illustrative organization</span></p><div class="cost-line"><span>Sample tasks</span><b>${selected?'8':'6'}</b></div><div class="cost-line"><span>Geofence</span><b>Approved polygon required</b></div><div class="cost-line"><span>Priority</span><b>${selected?'Evidence review':'Routine monitoring'}</b></div><div class="actions">${btn(selected?'Open Sanstha':'Open guided Vasti 07',"openGuidedVasti()",true)}</div></section></div><div class="card" style="margin-top:20px"><h2>Location-linked service trail</h2><div class="flow"><div><b>Work order</b>WO-2026-041</div><div><b>Worker</b>W-0184 / Meera</div><div><b>Service</b>T-1042 / Unit 03</div><div><b>Evidence</b>EV-1042-B / A</div></div></div>`}
function openGuidedVasti(){state.ward='M/E';state.vasti='Vasti 07';go(2)}
function sanstha(){return heading('Sahyog Swachhata Sanstha','S-014 · illustrative organization · Ward M/E / Vasti 07')+`<div class="grid three">${metric('WO-2026-041','Active work order','01–30 Sep 2026')}${metric('24','Mapped workers','22 present in baseline sample')}${metric('8','Tasks in Vasti 07','One service used for walkthrough')}</div><div class="grid two" style="margin-top:20px"><section class="card"><h2>Daily deployment</h2>${table(['Worker','Assignment','Status'],[['Meera Patil / W-0184','Unit 03',badge(state.attended?'Present':'Not marked',state.attended?'':'amber')],['Ravi Jadhav / W-0211','Unit 04',badge('Present')],['Asha More / W-0196','Unit 05',badge('Present')],['Imran Shaikh / W-0228','Unit 06',badge('Geofence review','amber')]])}<div class="actions">${btn('Open Meera’s attendance','go(3)',true)}</div></section><section class="card"><h2>Coordinator’s responsibilities</h2><div class="timeline"><div class="event">Maintain worker mapping<small>Within the valid work order and allocated geography</small></div><div class="event">Monitor attendance and evidence<small>Follow up on missing or incomplete submissions</small></div><div class="event">Respond to rework and notices<small>BMC verification and approval controls remain in place</small></div></div><div class="strip">Sample worker names are fictional. The coordinator cannot bypass BMC approval gates.</div></section></div>`}
function attendance(){return heading('Attendance with location context','Worker journey · geofence, roster and identity checks')+`<div class="grid equal"><div class="phone"><div class="phone-top"><b>07:02</b><span>${state.offline?'Offline queue':'Online'}</span></div><h2>Good morning, Meera</h2><p class="muted">Vasti 07 / Unit 03</p><div class="card"><div class="eyebrow">Today’s assignment</div><h3 style="margin-top:10px">Sweep shared lane</h3><p>WO-2026-041<br>07:00–11:00 sample shift</p>${badge(state.attended?'Attendance captured':'Ready for check-in',state.attended?'':'gray')}</div><div class="card"><b>Sample GPS check</b><p>19.0614° N, 72.9232° E<br>Within illustrative service area</p><small>Location is simulated, not device GPS.</small></div>${btn(state.attended?'Attendance captured':'Simulate check-in','act("attend")',true,state.attended)}</div><section class="card"><h2>What the platform validates</h2><div class="timeline"><div class="event">Valid worker and roster<small>W-0184 mapped to WO-2026-041</small></div><div class="event">Permitted location<small>Point-in-polygon or approved radius rule</small></div><div class="event">Timestamp and device context<small>Original capture metadata retained</small></div><div class="event">Optional identity assurance<small>Liveness-assisted 1:1 verification only under BMC-approved policy</small></div></div><label class="checkbox"><input type="checkbox" ${state.offline?'checked':''} onchange="state.offline=this.checked;render()">Simulate low connectivity</label><div class="strip amber">A failed identity or location check follows an exception/manual-review path. AI does not automatically penalize a worker.</div><div class="actions">${btn('View assigned task','go(4)',true)}</div></section></div>`}
function task(){return heading('T-1042 / Sweep shared lane','15 Sep 2026 · Meera Patil · Unit 03 · WO-2026-041')+`<div class="grid two"><section class="card"><div class="row"><h2>Task checklist</h2>${badge(state.submitted?'Submitted':'Assigned',state.submitted?'':'gray')}</div><div class="timeline"><div class="event">Check in within permitted geography<small>${state.attended?'Captured in this session':'Capture attendance before submission'}</small></div><div class="event">Capture the before condition<small>Bind evidence to worker, task, time and location</small></div><div class="event">Complete the assigned service<small>Sweep the shared lane and clear the collection point</small></div><div class="event">Capture the after condition<small>Submit for supervisor verification</small></div></div><div class="actions">${btn('Capture evidence','go(5)',true)}</div></section><section class="card"><h2>Service context</h2><div class="cost-line"><span>Vasti / Unit</span><b>07 / 03</b></div><div class="cost-line"><span>Assigned to</span><b>W-0184</b></div><div class="cost-line"><span>Evidence required</span><b>Before + after</b></div><div class="cost-line"><span>Review</span><b>Supervisor</b></div><div class="strip" style="margin-top:20px">Task completion becomes verified service only after configured checks and authorized review.</div></section></div>`}
function evidencePage(){return heading('Before / after evidence','T-1042 · capture context travels with each evidence item',badge(state.offline?'Offline simulation':'Online simulation','gray'))+`<div class="grid equal">${['Before','After'].map((w,i)=>`<section class="card"><h2>${w} condition</h2>${evidence(w)}<div class="cost-line"><span>Evidence ID</span><b>EV-1042-${i?'A':'B'}</b></div><div class="cost-line"><span>Sample capture</span><b>15 Sep / ${i?'09:18':'07:06'}</b></div><div class="cost-line"><span>Sample location</span><b>19.0614, 72.9232</b></div><p class="muted">${state[w.toLowerCase()]?'Evidence attached to T-1042.':'Illustrative scene ready to attach.'}</p>${btn(state[w.toLowerCase()]?'Attached':'Attach '+w.toLowerCase()+' sample',`act('${w.toLowerCase()}')`,true,state[w.toLowerCase()])}</section>`).join('')}</div><div class="card" style="margin-top:20px"><div class="row"><div><h2>Submission queue</h2><span class="muted">${state.submitted?'Submitted for supervisor review':state.synced?'Evidence synchronized':state.before&&state.after?'Evidence captured, ready to synchronize':'Capture both sample evidence items'}</span></div>${badge(state.synced?'Synchronized':'Local sample queue',state.synced?'':'amber')}</div><div class="actions">${btn('Simulate reconnect & sync',"act('sync')",false,!(state.before&&state.after)||state.synced)}${btn('Submit completion',"act('submit')",true,!(state.attended&&state.synced)||state.submitted)}${btn('Open verification','go(6)')}</div><p class="subtle">Production sync would validate duplicates, stale assignments and conflicts. This prototype simulates those states without storing photos.</p></div>`}
function verify(){return heading('Supervisor verification','T-1042 · reviewer: Kavita Deshmukh (fictional)',badge(state.verified?'Verified':state.rework?'Rework requested':state.submitted?'Awaiting review':'Awaiting submission',state.verified?'':'amber'))+`<div class="grid two"><section class="card"><h2>Evidence comparison</h2><div class="grid equal">${evidence('Before')}${evidence('After')}</div><div class="grid three" style="margin-top:20px"><div><small>Attendance</small><p>${badge(state.attended?'Captured':'Missing',state.attended?'':'red')}</p></div><div><small>Evidence</small><p>${badge(state.submitted?'Submitted':'Missing',state.submitted?'':'red')}</p></div><div><small>Location</small><p>${badge('Sample in-area')}</p></div></div><label class="field">Reviewer observation<textarea id="review-note">Service evidence reviewed against the task and location.</textarea></label><div class="actions">${btn('Verify service',"act('verify')",true,!state.submitted||state.verified)}${btn('Request rework',"act('rework')",false,!state.submitted)}${btn('Reject submission',"act('reject')",false,!state.submitted)}</div></section><section class="card"><h2>Review with accountability</h2><div class="timeline"><div class="event">Inspect both evidence items<small>Photos shown here are conceptual schematics</small></div><div class="event">Check task, location and timestamp<small>All refer to the same service instance</small></div><div class="event">Record a reason<small>Return and reject actions require an observation</small></div><div class="event">Retain the decision trail<small>Review affects eligibility, not fund disbursement</small></div></div><div class="strip">AI quality and duplicate flags support a reviewer. The authorized human owns the decision.</div></section></div>`}
function grievance(){return heading('Citizen grievance','Location-linked complaint with ticket and follow-up')+`<div class="grid equal"><div class="phone"><div class="phone-top"><b>Citizen service</b><span>QR context loaded</span></div><h2>Report a concern</h2><small>Sample QR context: Vasti 07 / Unit 03</small><label class="field">Category<select id="category"><option>Missed waste collection</option><option>Incomplete cleaning</option><option>Overflowing collection point</option></select></label><label class="field">Description<textarea id="complaint">${esc(state.grievanceText)}</textarea></label><div class="strip">Sample location attached. This demo accepts no personal information or uploads.</div>${btn(state.grievance?'Ticket created':'Submit sample grievance',"act('grievance')",true,state.grievance)}</div><section class="card"><h2>${state.grievance?'GR-2026-0087':'Ticket lifecycle'}</h2>${badge(state.closed?'Closed after inspection':state.grievance?'Assigned to ward team':'Not yet submitted',state.closed?'':'amber')}<div class="timeline"><div class="event">Register with location<small>QR supplies service-area context</small></div><div class="event">Route to accountable team<small>Link to T-1042 where relevant</small></div><div class="event">Monitor response and escalation<small>Illustrative due time: 16 Sep, 10:00. Final SLA is policy-configured.</small></div><div class="event">Confirm corrective action<small>Inspection and closure remain traceable</small></div></div><div class="actions">${btn('Open inspection','go(8)',true)}</div></section></div>`}
function inspection(){return heading('Inspection and exception handling','IN-2026-031 · linked to GR-2026-0087 and T-1042')+`<div class="grid two"><section class="card"><h2>Collection point review</h2><div class="strip amber">Illustrative finding: residual waste at the collection point. An authorized officer reviews the notice and adjustment basis.</div><div class="timeline"><div class="event">Inspect and record observation<small>${state.inspected?'Inspection recorded':'Pending field review simulation'}</small></div><div class="event">Issue notice / request corrective work<small>${state.notice?'Notice N-031 recorded with illustrative deduction basis':'Authorized review required'}</small></div><div class="event">Record corrective work and closure<small>${state.closed?'Corrective work verified. Grievance closed.':'Closure requires a recorded inspection and notice response'}</small></div></div><div class="actions">${btn('Record inspection',"act('inspect')",true,!state.grievance||state.inspected)}${btn('Record authorized notice',"act('notice')",false,!state.inspected||state.notice)}${btn('Verify correction & close',"act('close')",false,!state.notice||state.closed)}</div></section><section class="card"><h2>Eligibility impact</h2><div class="cost-line"><span>Grievance</span>${badge(state.closed?'Closed':state.grievance?'Open':'Not created',state.closed?'':'amber')}</div><div class="cost-line"><span>Rework / exception</span>${badge(state.closed?'Resolved':'Unresolved',state.closed?'':'amber')}</div><div class="cost-line"><span>Illustrative deduction</span><b>₹2,000</b></div><p class="muted">The sample deduction has an explicit human-authorized basis. It is not a BMC tariff or an automatic consequence of a complaint.</p><div class="actions">${btn('Review grant gates','go(9)',true)}</div></section></div>`}
function gates(){return [state.attended,state.submitted,state.verified,state.grievance&&state.closed]}
function finance(){const ready=gates().every(Boolean);return heading('Assistance-grant recommendation','S-014 · September 2026 sample period · synthetic amounts',badge(state.reconciled?'Reconciled (simulated)':state.approved?'Approved (simulated)':state.recommended?'Awaiting checker':'Draft',state.approved?'':'amber'))+`<div class="grid two"><section class="card"><h2>Validation gates</h2>${table(['Gate','Result','Record'],[['Work order & worker mapping',badge('Valid sample'),'WO-2026-041'],['Attendance / geofence',badge(state.attended?'Pass':'Pending',state.attended?'':'amber'),'W-0184'],['Task and evidence',badge(state.submitted?'Pass':'Pending',state.submitted?'':'amber'),'T-1042'],['Supervisor verification',badge(state.verified?'Pass':'Pending',state.verified?'':'amber'),'EV-1042-B / A'],['Grievance, inspection, rework',badge(state.closed?'Resolved':'Pending',state.closed?'':'amber'),'GR-0087 / IN-031']])}<div class="actions">${btn('Create recommendation',"act('recommend')",true,!ready||state.recommended)}${btn('Checker: approve sample',"act('approve')",false,!state.recommended||state.approved)}${btn('Simulate finance reconciliation',"act('reconcile')",false,!state.approved||state.reconciled)}</div><p class="subtle">Buttons simulate distinct maker, checker and finance actors. Production separation of duties requires server-enforced permissions.</p></section><section class="card"><h2>Illustrative computation</h2><div class="cost-line"><span>Service / work value</span><b>₹1,20,000</b></div><div class="cost-line"><span>Attendance ineligibility</span><b>− ₹4,000</b></div><div class="cost-line"><span>Other unverified work</span><b>− ₹6,000</b></div><div class="cost-line"><span>Authorized penalty</span><b>− ₹2,000</b></div><div class="cost-line"><span>Other adjustments</span><b>₹0</b></div><p class="muted">${ready?'Recommended eligible amount':'Potential amount, subject to gates'}</p><div class="amount">₹1,08,000</div><p class="subtle">Adjustments are distinct sample buckets across the period, not repeated deductions for T-1042.</p><div class="strip">Actual disbursement remains in BMC’s designated finance / ERP / treasury process.</div>${state.reconciled?'<p><b>Sample external reference</b><br>DEMO-UTR-0091 · no funds moved</p>':''}</section></div><section class="card" style="margin-top:20px"><h2>Decision and evidence trail</h2>${state.audit.length?state.audit.slice(0,7).map(e=>`<div class="audit">${e.time} · ${esc(e.text)}</div>`).join(''):'<p class="muted">Complete the walkthrough to create audit events.</p>'}</section>`}
function analytics(){return heading('Performance and decision support','Synthetic sample cohort · 120 tasks · 15 September 2026')+`<div class="grid four">${metric(state.verified?'80.8%':'80%','Verified completion',state.verified?'97 / 120 tasks':'96 / 120 tasks')}${metric('93.3%','Attendance','112 / 120 workers')}${metric(state.closed?'1':'0','Demo grievances closed','Session activity')}${metric(state.approved?'₹1.08 L':'Pending','Sample approved amount','Human approval simulation')}</div><div class="grid equal" style="margin-top:20px"><section class="card"><h2>Verified tasks by sample ward</h2><div class="chart-cols">${[['M/E',state.verified?27:26],['L',21],['N',28],['S',21]].map(([n,v])=>`<div style="height:${v*4}px"><b>${v}</b><span>${n}</span></div>`).join('')}</div><p class="subtle">Total ${state.verified?97:96}. Remaining tasks are pending verification or exceptions.</p></section><section class="card"><h2>Sanstha scorecard dimensions</h2>${[['Attendance',93],['Task completion',80],['Evidence quality',88],['Grievance closure',76]].map(([n,v])=>`<div class="row"><span>${n}</span><b>${v}%</b></div><div class="bar"><i style="width:${v}%"></i></div>`).join('')}<p class="subtle">Illustrative independent scorecard values. Final weighting requires BMC-approved rules.</p></section></div><section class="card" style="margin-top:20px"><h2>Officer review priorities</h2><div class="flow"><div><b>Ward / Zone Officer</b>Follow up on unresolved evidence and SLA risk.</div><div><b>Command Centre</b>Compare trends, hotspots and Sanstha performance.</div><div><b>Finance / Approver</b>Inspect recommendations, adjustments and reconciliation.</div></div><div class="actions">${btn('Export sample MIS CSV','exportCsv()')}${btn('Review audit trail','go(9)')}</div></section>`}
function admin(){return heading('Scheme configuration and governance','BMC Admin · conceptual configuration workflow')+`<div class="grid equal"><section class="card"><h2>Sample rules</h2><div class="cost-line"><span>Scheme geography</span><b>Ward / Vasti / Unit</b></div><div class="cost-line"><span>Evidence requirement</span><b>Before and after</b></div><div class="cost-line"><span>Approval</span><b>Maker-checker</b></div><div class="cost-line"><span>Biometric verification</span><b>Disabled by default</b></div><label class="field">Illustrative grievance SLA<select id="sla"><option>24 hours</option><option>48 hours</option></select></label><div class="actions">${btn('Stage configuration change',"act('config')",true,state.configPending||state.configApproved)}${btn('Checker: approve change',"act('configApprove')",false,!state.configPending||state.configApproved)}</div><p>${badge(state.configApproved?'Sample change approved':state.configPending?'Pending checker':'Current sample configuration',state.configApproved?'':'gray')}</p></section><section class="card"><h2>Configuration boundaries</h2><div class="timeline"><div class="event">Controlled masters<small>Sansthas, work orders, roles and geographic allocation</small></div><div class="event">Configurable policy<small>SLA, evidence, notice, penalty and grant-validation rules</small></div><div class="event">Approval and audit<small>High-risk changes remain server-authoritative</small></div><div class="event">BMC design decisions<small>Languages, accessibility, retention, hosting and integrations</small></div></div><div class="strip">This prototype uses browser-session state. It does not implement production security or a backend.</div></section></div>`}
function act(a){let message='';switch(a){case'attend':state.attended=true;message='Worker: attendance captured with sample geofence context';break;case'before':case'after':state[a]=true;message='Worker: '+a+' evidence attached to T-1042';break;case'sync':if(!(state.before&&state.after))return;state.synced=true;state.offline=false;message='System simulation: evidence synchronized, original metadata retained';break;case'submit':if(!(state.attended&&state.synced))return;state.submitted=true;state.rework=false;message='Worker: T-1042 submitted for verification';break;case'verify':if(!state.submitted)return;state.verified=true;state.rework=false;message='Supervisor: service verified';break;case'rework':case'reject':if(!state.submitted)return;if(!$('review-note').value.trim()){toast('Add a reviewer observation first.');return;}state.submitted=false;state.verified=false;state.rework=a==='rework';state.recommended=false;state.approved=false;state.reconciled=false;message='Supervisor: '+(a==='rework'?'rework requested':'submission rejected')+' — '+$('review-note').value.trim();break;case'grievance':if(!$('complaint').value.trim()){toast('Enter a description.');return;}state.grievance=true;state.grievanceText=$('complaint').value.trim();message='Citizen: GR-2026-0087 created and linked to Unit 03';break;case'inspect':if(!state.grievance)return;state.inspected=true;message='Inspector: IN-031 residual-waste observation recorded';break;case'notice':if(!state.inspected)return;state.notice=true;message='Authorized officer: notice N-031 and sample ₹2,000 deduction basis recorded';break;case'close':if(!state.notice)return;state.closed=true;message='Inspector: corrective work verified; GR-0087 closed';break;case'recommend':if(!gates().every(Boolean))return;state.recommended=true;message='Maker: ₹1,08,000 sample recommendation created';break;case'approve':if(!state.recommended)return;state.approved=true;message='BMC checker: sample recommendation approved';break;case'reconcile':if(!state.approved)return;state.reconciled=true;message='Finance adapter simulation: paid status / DEMO-UTR-0091 reconciled; no funds moved';break;case'config':state.configPending=true;message='BMC Admin maker: sample SLA '+$('sla').value+' staged for review';break;case'configApprove':if(!state.configPending)return;state.configApproved=true;message='BMC Admin checker: sample configuration change approved';break;default:return;}log(message);render();toast(message)}
function exportCsv(){const csv='Scope,Assigned,Verified,Pending review,Exceptions\nSynthetic cohort,120,'+(state.verified?97:96)+','+(state.verified?11:12)+',12\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='BSSY-synthetic-MIS.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Synthetic MIS exported')}
function render(){const screens=[dashboard,ward,sanstha,attendance,task,evidencePage,verify,grievance,inspection,finance,analytics,admin];$('app').innerHTML=state.page<0?login():shell(screens[state.page]());}
render();
if(document.modelContext?.registerTool){try{document.modelContext.registerTool({name:'navigate_bssy_demo',description:'Navigate a conceptual BSSY screen. Does not complete or approve workflow actions.',inputSchema:{type:'object',properties:{screen:{type:'integer',minimum:0,maximum:11}},required:['screen'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!Number.isInteger(input.screen)||input.screen<0||input.screen>11)throw Error('Screen must be 0–11');go(input.screen);return {screen:pages[state.page],conceptual:true}}});}catch(e){console.info('Optional WebMCP registration unavailable')}}
</script></body></html>
